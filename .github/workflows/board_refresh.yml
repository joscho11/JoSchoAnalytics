name: Draft Board ADP Refresh

# Re-pulls LIVE Sleeper ADP for the shipped 2026 Draft Board and recomputes ONLY the
# price-derived columns against the FROZEN projections (see refresh_board_adp.py and
# .claude/skills/board-refresh/SKILL.md). Commits ONLY the regenerable overlay CSV;
# never a frozen artifact. A failed pull publishes nothing — the last-good board stays live.

on:
  schedule:
    # Daily 13:00 UTC = 9am ET (EDT). Cadence is this one line: weekly = '0 13 * * 2'.
    # On/after SEASON_START (default 2026-09-04) the scheduled run auto-pauses (no-op,
    # commits nothing) via the date guard in refresh_board_adp.py.
    - cron: '0 13 * * *'

  # Manual run — always executes (bypasses the in-season pause).
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even in-season (bypass the pre-draft freeze date guard)'
        type: boolean
        default: true

concurrency:
  group: board-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Lean install — an ADP pull needs only pandas + requests (no model stack).
      - name: Install dependencies
        run: pip install pandas requests

      # ---------------------------------------------------------------------------
      # POINT-IN-TIME MARKET ARCHIVE (research evidence; see capture_market_snapshot.py)
      # Runs BEFORE the board refresh so the raw response is archived before any lossy
      # field selection. Deliberately NOT gated by the in-season pause that stops the
      # board overlay: capturing through the season is how we would detect Sleeper
      # mutating its 2026 projections toward realized values, which is exactly the
      # contamination confirmed for 2020 and the reason this archive exists.
      # FAILURE ISOLATION: continue-on-error, so a failed research capture is visible as
      # a red step and diagnosable in failures.jsonl but NEVER blocks the live board.
      - name: Capture dated Sleeper market snapshot (research, private)
        id: market_capture
        continue-on-error: true
        run: python fantasy/seasonal_projections/capture_market_snapshot.py --season 2026

      - name: Refresh board ADP
        env:
          # '1' only on a manual dispatch with force=true; empty on schedule so the
          # in-season date guard governs the scheduled run.
          BOARD_REFRESH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: python fantasy/seasonal_projections/refresh_board_adp.py

      # Capture the PRIVATE research log (adp_logs/ is gitignored — never on the tip).
      # Uploaded as a build artifact so CI runs' snapshots + ledger rows aren't lost,
      # without committing them. Runs on success and on abort (to keep the abort ledger row).
      - name: Upload private ADP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adp-logs-${{ github.run_id }}
          path: fantasy/seasonal_projections/adp_logs/
          if-no-files-found: ignore
          retention-days: 90

      # Private point-in-time archive: dated raw response + normalized snapshot +
      # metadata + append-only manifest/failure ledger. market_snapshots/ is gitignored,
      # so a CI checkout starts empty and this artifact holds exactly THIS run's capture.
      # 90 days is the hard ceiling GitHub allows on a PUBLIC repository — see the
      # retention note in capture_market_snapshot.py; the durable copy is Joseph's local
      # archive, which never expires.
      - name: Upload private market snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-${{ github.run_id }}
          path: fantasy/seasonal_projections/market_snapshots/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

      # Commit ONLY the overlay. Gated on success: an aborted run fails the job above and
      # never reaches here; a paused run leaves the overlay unchanged so nothing commits.
      - name: Commit the refreshed overlay
        if: success()
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fantasy/seasonal_projections/board_adp_live_2026.csv
          git diff --staged --quiet || git commit -m "Board ADP refresh $(date +'%Y-%m-%d')"
          git push
