name: Grade published releases

on:
  schedule:
    # Poll after NFL game windows. The command is a no-op until at least one game is final.
    - cron: '17 */6 * * 0,1,2,5,6'
  workflow_dispatch:

concurrency:
  group: grade-published-releases
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install grading dependencies
        run: pip install -r requirements-ci.txt

      - name: Grade fantasy releases
        id: grade_fantasy
        continue-on-error: true
        run: python -m publishing.cli grade-published --product fantasy

      - name: Grade prediction releases
        id: grade_predictions
        continue-on-error: true
        run: python -m publishing.cli grade-published --product predictions

      - name: Grade Anytime TD boards
        id: grade_anytime_td
        continue-on-error: true
        run: python -m publishing.cli grade-published --product anytime_td

      - name: Commit new grading artifacts
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/releases betting/anytime_td
          git diff --staged --quiet || git commit -m "Auto: grade published releases"
          git pull --rebase
          git push

      - name: Report grading failures
        if: always() && (steps.grade_fantasy.outcome == 'failure' || steps.grade_predictions.outcome == 'failure' || steps.grade_anytime_td.outcome == 'failure')
        run: |
          echo "At least one product grader failed. Successful product artifacts were committed where possible."
          exit 1
