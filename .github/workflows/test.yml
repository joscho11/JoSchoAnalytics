name: Tests

# Offline page, publishing, and public-boundary suites on every push and PR
# against main. This repository is the website plus release artifacts.
# Training and model files belong in private producer repositories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytests:
    name: Python test suites (pages + publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run hermetic Python test suites
        env:
          APP_OFFLINE: '1'
        run: >-
          pytest -v -m "not visual"
          tests/test_public_boundary.py
          tests/test_dashboard_utils.py
          tests/test_calibration.py
          tests/test_app_draft_board.py
          tests/test_site_nav.py
          tests/test_page_dfs.py
          tests/test_board_page.py
          tests/test_betting_pages.py
          tests/test_live_2026.py
          tests/test_fantasy_league_pages.py
          tests/test_help_page.py
          tests/test_film_room.py
          tests/test_model_explanations.py
          tests/test_app_talent_columns.py
          tests/test_runtime_telemetry.py
          tests/test_responsive_layout.py
          tests/test_no_stale_ats_claim.py
          tests/test_breakeven_claim.py
          tests/test_agent_market_provenance.py
          tests/test_no_credential_leak.py
          tests/test_page_futures.py
          tests/test_page_rookie_board.py
          tests/test_weekly_fantasy_source.py
          tests/test_fantasy_accuracy.py
          tests/test_espn_adp.py
          tests/test_yahoo_adp.py
          tests/test_board_refresh.py
          tests/test_board_refresh_coverage.py
          tests/test_publishing_pipeline.py
          tests/test_cbb_daily_contract.py
          tests/test_cbb_daily_page.py
          tests/test_visual_regression.py

  responsive:
    name: Responsive layout + visual
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run responsive and visual suites and REQUIRE zero skips
        env:
          APP_OFFLINE: '1'
        run: |
          set -o pipefail
          pytest -v tests/test_responsive_layout.py tests/test_visual_regression.py -rs | tee /tmp/resp.log
          if grep -qE "^SKIPPED|[0-9]+ skipped" /tmp/resp.log; then
            echo "::error::responsive cases skipped -- the browser guard is not actually running"
            exit 1
          fi
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/artifacts/
          if-no-files-found: ignore

  deploy-parity:
    name: deploy parity (py3.12 + requirements.txt, as the cloud installs)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python (runtime.txt version)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install the cloud deploy set
        run: pip install -r requirements.txt pytest

      - name: Run app suites under the exact deploy environment
        env:
          APP_OFFLINE: '1'
        run: >-
          pytest -v -m "not visual"
          tests/test_public_boundary.py
          tests/test_dashboard_utils.py
          tests/test_app_draft_board.py
          tests/test_site_nav.py
          tests/test_page_dfs.py
          tests/test_board_page.py
          tests/test_betting_pages.py
          tests/test_live_2026.py
          tests/test_fantasy_league_pages.py
          tests/test_help_page.py
          tests/test_film_room.py
          tests/test_model_explanations.py
          tests/test_runtime_telemetry.py
          tests/test_responsive_layout.py
          tests/test_no_stale_ats_claim.py
          tests/test_breakeven_claim.py
          tests/test_agent_market_provenance.py
          tests/test_no_credential_leak.py
          tests/test_page_futures.py
          tests/test_page_rookie_board.py
          tests/test_weekly_fantasy_source.py
          tests/test_fantasy_accuracy.py
          tests/test_espn_adp.py
          tests/test_yahoo_adp.py
          tests/test_cbb_daily_contract.py
          tests/test_cbb_daily_page.py
          tests/test_visual_regression.py
