name: Weekly NFL Predictions

on:
  schedule:
    # Tuesday 9am ET = 14:00 UTC (EST) / 13:00 UTC (EDT during season — runs 1hr late in DST)
    - cron: '0 14 * * 2'
    # Thursday 9pm ET = 02:00 UTC Friday (EST) / 01:00 UTC (EDT during season — runs 1hr late in DST)
    - cron: '0 2 * * 5'
    # Sunday 9am ET = 14:00 UTC (EST) / 13:00 UTC (EDT during season — runs 1hr late in DST)
    - cron: '0 14 * * 0'

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'thursday'
        type: choice
        options:
          - tuesday
          - thursday
          - sunday
          - backfill
      target_week:
        description: 'Target week number (for backfill mode only)'
        required: false
        type: number

concurrency:
  group: predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      # Determine mode based on what triggered the run
      - name: Set mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 14 * * 2" ]; then
            echo "MODE=tuesday" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 2 * * 5" ]; then
            echo "MODE=thursday" >> $GITHUB_ENV
          else
            echo "MODE=sunday" >> $GITHUB_ENV
          fi

      - name: Run spread predictions
        run: papermill betting/predict_betting.ipynb /tmp/predict_out.ipynb -p MODE ${{ env.MODE }} -p TARGET_WEEK ${{ github.event.inputs.target_week || 'None' }}

      - name: Upload failed spread notebook
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-spread-notebook-${{ github.run_id }}
          path: /tmp/predict_out.ipynb

      - name: Run totals predictions
        if: success()
        run: papermill betting/predict_totals.ipynb /tmp/totals_out.ipynb -p MODE ${{ env.MODE }} -p TARGET_WEEK ${{ github.event.inputs.target_week || 'None' }}

      - name: Upload failed totals notebook
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-totals-notebook-${{ github.run_id }}
          path: /tmp/totals_out.ipynb

      # Agent deps (llama-index, anthropic) are excluded from requirements-ci.txt
      # to keep the Thu/Sun runs lean. Install them only for the Tuesday agent run.
      - name: Install agent dependencies (Tuesday only)
        if: success() && (github.event.schedule == '0 14 * * 2' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'tuesday'))
        run: pip install "llama-index==0.11.0" "llama-index-llms-anthropic==0.2.0" anthropic python-dotenv

      - name: Run agent analysis (Tuesday only)
        if: success() && (github.event.schedule == '0 14 * * 2' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'tuesday'))
        run: papermill betting/sports_betting_agent.ipynb /tmp/agent_out.ipynb -p TARGET_WEEK ${{ github.event.inputs.target_week || 'None' }}
        continue-on-error: true

      - name: Upload failed agent notebook
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-agent-notebook-${{ github.run_id }}
          path: /tmp/agent_out.ipynb

      - name: Commit updated trackers and analysis
        if: success()
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add betting/predictions_tracker.csv betting/totals_tracker.csv betting/agent_analysis_*.json
          git diff --staged --quiet || git commit -m "Auto (${{ env.MODE }}): week update $(date +'%Y-%m-%d')"
          git push
